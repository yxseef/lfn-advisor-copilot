[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#1e3a5f"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f7fa"
textColor = "#1f2937"
linkColor = "#1e3a5f"
borderColor = "#e2e8f0"
showWidgetBorder = true
baseRadius = "small"
baseFontSize = 15
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFontSizes = ["1.6rem", "1.25rem", "1.05rem", "0.95rem", "0.9rem", "0.85rem"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
chartCategoricalColors = ["#1e3a5f", "#3b6ea5", "#64748b", "#94a3b8", "#cbd5e1"]
